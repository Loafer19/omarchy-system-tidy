# Tests that need neither root nor Quickshell, on stock Ubuntu. Tests that
# need qs, a session bus or root skip themselves with a SKIP line.
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tools (jq 1.8 as on Arch, ShellCheck 0.11; checksums pinned)
        run: |
          bin=$RUNNER_TEMP/bin; mkdir -p "$bin"
          curl -fsSLo "$bin/jq" https://github.com/jqlang/jq/releases/download/jq-1.8.2/jq-linux-amd64
          echo "b1c22172dd303f3be49e935aa56aa48a8b7a46e0bc838b4997d3bb451495870f  $bin/jq" | sha256sum -c -
          chmod +x "$bin/jq"
          curl -fsSLo "$RUNNER_TEMP/sc.tar.xz" https://github.com/koalaman/shellcheck/releases/download/v0.11.0/shellcheck-v0.11.0.linux.x86_64.tar.xz
          echo "8c3be12b05d5c177a04c29e3c78ce89ac86f1595681cab149b65b97c4e227198  $RUNNER_TEMP/sc.tar.xz" | sha256sum -c -
          tar -xJf "$RUNNER_TEMP/sc.tar.xz" -C "$RUNNER_TEMP"
          mv "$RUNNER_TEMP/shellcheck-v0.11.0/shellcheck" "$bin/"
          echo "$bin" >> "$GITHUB_PATH"
      - name: Vendored UI unchanged
        run: tools/sync-ui.sh --check
      - name: Tests
        run: tests/run.sh
