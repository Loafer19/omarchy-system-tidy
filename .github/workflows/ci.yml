# Tests that need neither root nor Quickshell, on stock Ubuntu. Tests that
# need qs, a session bus or root skip themselves with a SKIP line.
name: CI
on:
  push:
    branches: [master]
  pull_request:
  workflow_dispatch:
permissions:
  contents: read
jobs:
  test:
    runs-on: ubuntu-24.04
    timeout-minutes: 10
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 22
      - name: Tools
        run: sudo apt-get update -qq && sudo apt-get install -y -qq --no-install-recommends jq
      - name: Vendored UI unchanged
        run: tools/sync-ui.sh --check
      - name: Tests
        run: tests/run.sh
